<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tabboard</title>
<script src="theme.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,700&family=IBM+Plex+Sans:wght@400;500;600&family=Syne:wght@800&family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=Space+Mono:wght@400;700&family=Fredoka:wght@500;600;700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --display: "Bricolage Grotesque", system-ui, sans-serif;
    --body: "IBM Plex Sans", system-ui, sans-serif;
  }
  /* dark (Forest): deep green-greys */
  :root, :root[data-theme="dark"] {
    --ink: #111816; --surface: #17201d; --raise: #1f2b27; --line: #273631;
    --text: #e6eee9; --soft: #a9bab1; --muted: #75887e; --focus: #9fd9b8;
    --pop: #22302b; --pop-raise: #2c3c36; --pop-line: #3b4e47;
    --shadow: 0 24px 60px -12px rgba(0, 0, 0, .7), 0 0 0 1px rgba(0, 0, 0, .35);
    --todo: #e9b451; --progress: #72acec; --review: #b7a2ef; --staging: #5fcdb6;
    --blocked: #ec7a70; --backlog: #8a9a91; --done: #7fd39b;
    color-scheme: dark;
  }
  /* light (Paper) */
  :root[data-theme="light"] {
    --ink: #f3f3f1; --surface: #ffffff; --raise: #f0f0ee; --line: #e3e3df;
    --text: #1b1b1d; --soft: #45454c; --muted: #75757d; --focus: #4f46e5;
    --pop: #ffffff; --pop-raise: #f3f3f1; --pop-line: #d6d6d1;
    --shadow: 0 24px 50px -14px rgba(20, 20, 30, .28), 0 2px 6px rgba(20, 20, 30, .08);
    --todo: #b7790d; --progress: #2a6fc9; --review: #6d4fd6; --staging: #0f8a7c;
    --blocked: #cc3b3b; --backlog: #6f6f78; --done: #1d8a55;
    color-scheme: light;
  }
  @media (prefers-color-scheme: light) {
    :root:not([data-theme]) {
      --ink: #f3f3f1; --surface: #ffffff; --raise: #f0f0ee; --line: #e3e3df;
      --text: #1b1b1d; --soft: #45454c; --muted: #75757d; --focus: #4f46e5;
      --pop: #ffffff; --pop-raise: #f3f3f1; --pop-line: #d6d6d1;
      --shadow: 0 24px 50px -14px rgba(20, 20, 30, .28), 0 2px 6px rgba(20, 20, 30, .08);
      --todo: #b7790d; --progress: #2a6fc9; --review: #6d4fd6; --staging: #0f8a7c;
      --blocked: #cc3b3b; --backlog: #6f6f78; --done: #1d8a55;
      color-scheme: light;
    }
  }
  * { box-sizing: border-box; }
  html { background: var(--ink); }
  body { margin: 0; color: var(--text); background: var(--ink);
    font: 15px/1.5 var(--body); -webkit-font-smoothing: antialiased; }
  .wrap { max-width: 1440px; margin: 0 auto; padding: 36px 48px 64px; }

  /* top line */
  .top { display: flex; align-items: center; gap: 12px; color: var(--muted); font-size: 14px; }
  .greet { display: flex; align-items: center; gap: 14px; min-width: 0; }
  .greet-text { display: grid; gap: 3px; min-width: 0; }
  #hello { font: 600 21px/1.15 var(--display); color: var(--text); letter-spacing: -0.015em; }
  .greet-sub { color: var(--muted); font-size: 13.5px; }
  .greet-sub b { font-weight: 600; color: var(--text); }
  .chips:empty { display: none; }
  .date-tile { display: grid; justify-items: center; width: 54px; padding: 6px 0 5px; line-height: 1; flex: none;
    background: var(--surface); border: 1px solid var(--line); border-radius: 10px; }
  .dt-day, .dt-mon { font: 600 10.5px var(--body); letter-spacing: .06em; color: var(--muted); }
  .dt-num { font: 700 22px/1.1 var(--display); color: var(--text); }
  .top .grow { flex: 1; }
  .search { display: flex; align-items: center; gap: 8px; background: var(--surface);
    border: 1px solid var(--line); border-radius: 10px; padding: 0 10px; height: 36px; width: 280px; }
  .search:focus-within { border-color: var(--focus); }
  .search input { flex: 1; min-width: 0; background: none; border: 0; outline: 0; color: var(--text); font: inherit; }
  .search kbd { font: 12px var(--body); color: var(--muted); border: 1px solid var(--line); border-radius: 5px; padding: 0 6px; }
  .scope { display: flex; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 3px; }
  .scope button { background: none; border: 0; color: var(--muted); font: 500 13px var(--body);
    padding: 5px 12px; border-radius: 7px; cursor: pointer; }
  .scope button[aria-pressed="true"] { background: var(--raise); color: var(--text); }
  .icon-btn { background: none; border: 1px solid transparent; color: var(--muted); border-radius: 8px;
    height: 36px; padding: 0 8px; cursor: pointer; font: inherit; font-size: 13px; display: flex; align-items: center; gap: 6px; }
  .offline { display: inline-flex; align-items: center; gap: 6px; height: 36px; padding: 0 12px; border-radius: 10px; font-size: 12.5px; white-space: nowrap;
    background: color-mix(in srgb, var(--blocked) 14%, var(--surface)); color: var(--text); border: 1px solid color-mix(in srgb, var(--blocked) 40%, transparent); }
  .offline[hidden] { display: none; }
  .offline i { width: 7px; height: 7px; border-radius: 50%; background: var(--blocked); }
  .offline span { color: var(--soft); }
  [data-style="brutal"] .offline { border: var(--bw) solid var(--brd); background: var(--blocked); color: #000; box-shadow: var(--hard-sm); }
  [data-style="brutal"] .offline span { color: #000; font-family: var(--mono); }
  [data-style="brutal"] .offline i { background: #000; }
  [data-style="clay"] .offline { border: 0; border-radius: 999px; box-shadow: var(--clay-sm); }
  .icon-btn.spin svg { animation: spin .8s linear infinite; }
  .icon-btn:hover { color: var(--text); border-color: var(--line); }
  .sun { display: none; }
  :root[data-mode="light"] .sun { display: block; }
  :root[data-mode="light"] .moon { display: none; }
  .me-btn { background: none; border: 2px solid transparent; border-radius: 50%; padding: 0; cursor: pointer; display: grid; }
  .me-btn:hover, .me-btn[aria-expanded="true"] { border-color: var(--line); }
  #acct { position: fixed; z-index: 13; width: 300px; background: var(--pop); border: 1px solid var(--pop-line); border-radius: 14px;
    box-shadow: var(--shadow); padding: 6px; opacity: 0; visibility: hidden; transform: translateY(-4px);
    transition: opacity .14s ease-out, transform .14s ease-out; }
  #acct.on { opacity: 1; visibility: visible; transform: none; }
  .acct-me { display: flex; gap: 12px; align-items: center; padding: 10px 10px 12px; }
  .acct-me img { width: 40px; height: 40px; border-radius: 50%; }
  .acct-me b { display: block; font: 600 15px var(--display); }
  .acct-me span { color: var(--muted); font-size: 12.5px; }
  .acct-sep { height: 1px; background: var(--pop-line); margin: 4px 6px; }
  .acct-item { display: flex; align-items: center; gap: 10px; width: 100%; padding: 8px 10px; border-radius: 9px; border: 0; background: none;
    color: var(--text); font: 13.5px var(--body); text-align: left; cursor: pointer; text-decoration: none; }
  .acct-item:hover { background: var(--pop-raise); }
  .acct-item .end { margin-left: auto; color: var(--muted); font-size: 12px; display: grid; }
  .acct-item img { width: 22px; height: 22px; border-radius: 50%; }
  .acct-item .who { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .acct-item .who small { color: var(--muted); font-size: 12px; margin-left: 4px; }
  .acct-item.current .end { color: var(--done); }
  .acct-item.danger { color: var(--blocked); }
  .acct-label { color: var(--muted); font-size: 12px; padding: 6px 10px 2px; }
  .acct-panel { padding: 8px 10px 10px; font-size: 13px; color: var(--soft); line-height: 1.5; }
  .acct-panel p { margin: 0 0 10px; }
  .acct-panel b { color: var(--text); }
  .acct-panel input { width: 100%; background: var(--pop-raise); color: var(--text); border: 1px solid var(--pop-line); border-radius: 8px;
    padding: 8px 10px; font: 13px var(--body); margin-bottom: 8px; }
  .acct-panel input:focus { outline: none; border-color: var(--focus); }
  .acct-panel a { color: var(--focus); }
  .acct-actions { display: flex; gap: 8px; justify-content: flex-end; }
  .btn { border-radius: 8px; padding: 7px 14px; font: 600 13px var(--body); cursor: pointer; border: 1px solid var(--pop-line); background: var(--pop-raise); color: var(--text); }
  .btn.primary { background: var(--text); color: var(--pop); border-color: var(--text); }
  .btn.red { background: var(--blocked); border-color: var(--blocked); color: #fff; }
  .btn:disabled { opacity: .5; cursor: default; }
  .acct-msg { font-size: 12.5px; margin: -2px 0 8px; }
  .acct-msg.err { color: var(--blocked); }
  .acct-msg.warn { color: var(--todo); }
  #settings { position: fixed; z-index: 14; width: 400px; max-width: calc(100vw - 24px); max-height: calc(100vh - 90px); overflow: auto;
    background: var(--pop); border: 1px solid var(--pop-line); border-radius: 14px; box-shadow: var(--shadow); padding: 6px;
    opacity: 0; visibility: hidden; transform: translateY(-4px); transition: opacity .14s ease-out, transform .14s ease-out; }
  #settings.on { opacity: 1; visibility: visible; transform: none; }
  .set-form { display: flex; flex-direction: column; height: min(560px, calc(100vh - 110px)); padding: 0; }
  .set-form.forced { height: auto; max-height: calc(100vh - 110px); }
  .set-form > header { padding: 14px 16px 6px; }
  .set-form > .set-hint { padding: 0 16px; }
  .set-tabs { display: flex; gap: 2px; padding: 4px 12px 0; border-bottom: 1px solid var(--pop-line); }
  .set-tabs button { background: none; border: 0; border-bottom: 2px solid transparent; margin-bottom: -1px; padding: 8px 10px; font: 600 13px var(--body); color: var(--muted); cursor: pointer; }
  .set-tabs button:hover { color: var(--text); }
  .set-tabs button[aria-selected="true"] { color: var(--text); border-bottom-color: var(--text); }
  .set-body { flex: 1; overflow: auto; padding: 4px 16px 12px;
    /* scroll shadows: a soft shade appears at an edge only when there is more to scroll to */
    background: linear-gradient(var(--pop) 30%, transparent) center top, linear-gradient(transparent, var(--pop) 70%) center bottom,
      radial-gradient(farthest-side at 50% 0, rgba(0, 0, 0, .14), transparent) center top, radial-gradient(farthest-side at 50% 100%, rgba(0, 0, 0, .14), transparent) center bottom;
    background-repeat: no-repeat; background-size: 100% 28px, 100% 28px, 100% 10px, 100% 10px; background-attachment: local, local, scroll, scroll; }
  .set-pane > .set-group:first-child > .set-label:first-child { margin-top: 12px; }
  .set-group { padding: 10px 0; }
  .set-group + .set-group { border-top: 1px solid var(--pop-line); }
  .set-group .set-toggle { margin-top: 0; }
  .set-pane .look-tiles { margin-top: 4px; }
  .set-foot { display: flex; align-items: center; justify-content: flex-end; gap: 8px; padding: 12px 16px; border-top: 1px solid var(--pop-line); }
  .set-foot .acct-msg { margin: 0 auto 0 0; }
  #settings { width: 460px; padding: 0; }
  [data-style="brutal"] .set-tabs { border-bottom: 2px solid var(--brd); }
  [data-style="brutal"] .set-tabs button { font-family: var(--head); border-bottom-width: 4px; margin-bottom: -2px; }
  [data-style="brutal"] .set-tabs button[aria-selected="true"] { border-bottom-color: var(--todo); }
  [data-style="brutal"] .set-group + .set-group, [data-style="brutal"] .set-foot { border-color: var(--brd); border-top-width: 2px; }
  [data-style="clay"] .set-tabs { border: 0; gap: 6px; padding: 6px 14px 4px; }
  [data-style="clay"] .set-tabs button { border: 0; border-radius: 999px; padding: 6px 14px; }
  [data-style="clay"] .set-tabs button[aria-selected="true"] { background: var(--progress); color: #fff; box-shadow: var(--clay-in); }
  [data-style="clay"] .set-group + .set-group, [data-style="clay"] .set-foot { border-color: var(--line); }
  .set-form header { display: flex; align-items: center; margin-bottom: 8px; }
  .set-form header b { font: 600 16px var(--display); margin-right: auto; }
  .set-label { color: var(--muted); font-size: 12px; margin: 12px 0 6px; }
  .set-hint { color: var(--muted); font-size: 12.5px; line-height: 1.5; margin: 6px 0; }
  .set-owners { display: grid; gap: 2px; }
  .set-owner { display: flex; align-items: center; gap: 10px; padding: 7px 8px; border-radius: 9px; cursor: pointer; font-size: 13.5px; }
  .set-owner:hover { background: var(--pop-raise); }
  .set-owner input { accent-color: var(--text); margin: 0; }
  .set-owner img { width: 22px; height: 22px; border-radius: 6px; }
  .set-owner small { color: var(--muted); margin-left: 6px; font-size: 12px; }
  .set-fields { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .set-fields label { display: grid; gap: 4px; font-size: 12px; color: var(--muted); }
  .set-fields input { background: var(--pop-raise); color: var(--text); border: 1px solid var(--pop-line); border-radius: 8px; padding: 7px 9px; font: 13px var(--body); }
  .set-fields input:focus { outline: none; border-color: var(--focus); }
  .project header .owner { color: var(--muted); font-size: 12px; border: 1px solid var(--line); border-radius: 6px; padding: 0 6px; align-self: center; }
  .kind-line { display: block; font: 400 12px var(--body); color: var(--muted); margin-top: 2px; }
  .p-label span { opacity: .8; margin-left: 4px; }
  .pchip .ltr svg { display: block; }
  .kind-tag { color: var(--muted); font-size: 11.5px; border: 1px solid var(--line); border-radius: 6px; padding: 0 6px; align-self: center; }
  .set-toggle { margin-top: 10px; align-items: flex-start; }
  .set-toggle span small { display: block; margin: 2px 0 0; }
  .chip small, .p-list small { color: var(--muted); font-size: 11.5px; }
  /* skeletons */
  .sk { display: block; height: 12px; border-radius: 6px; background: var(--raise); position: relative; overflow: hidden; }
  .sk::after { content: ""; position: absolute; inset: 0; transform: translateX(-100%);
    background: linear-gradient(90deg, transparent, color-mix(in srgb, var(--text) 7%, transparent), transparent); animation: shimmer 1.4s ease-in-out infinite; }
  @keyframes shimmer { to { transform: translateX(100%); } }
  .sk-card header { padding: 18px 20px 14px; }
  .sk-row { display: grid; grid-template-columns: 52px 1fr 40px; gap: 12px; align-items: center; padding: 13px 20px; }
  .sk-row .sk:last-child { justify-self: end; }
  .sk-owner { display: flex; align-items: center; gap: 10px; padding: 9px 8px; }
  .sk-chip { height: 32px; border-radius: 9px; }
  html.loading .st sup { visibility: hidden; }
  .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
  @media (prefers-reduced-motion: reduce) { .sk::after { animation: none; } }
  #signin { position: fixed; inset: 0; z-index: 20; background: var(--ink); display: grid; place-items: center; padding: 16px; }
  #signin[hidden] { display: none; }
  .signin-card { width: 440px; max-width: 100%; background: var(--surface); border: 1px solid var(--line); border-radius: 18px; padding: 28px; }
  .signin-card h1 { margin: 0 0 8px; font: 600 26px var(--display); letter-spacing: -0.02em; }
  .signin-card p { color: var(--soft); margin: 0 0 16px; line-height: 1.55; font-size: 14px; }
  .signin-card .acct-panel { padding: 0; }
  .auth { display: grid; gap: 10px; }
  .gh-signin { display: inline-flex; align-items: center; justify-content: center; gap: 8px; width: 100%; padding: 10px 14px; font-size: 14px; }
  .token-alt summary { cursor: pointer; color: var(--muted); font-size: 13px; padding: 4px 0; }
  .token-alt[open] summary { margin-bottom: 8px; }
  .device-step { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 8px 0; font-size: 13.5px; color: var(--soft); }
  .device-code { font: 700 20px var(--mono, ui-monospace, monospace); letter-spacing: .08em; padding: 6px 12px; border-radius: 8px; border: 1px dashed var(--line);
    background: var(--raise); color: var(--text); cursor: pointer; }
  .device-code.ok { border-style: solid; border-color: var(--done); }
  .device-wait { display: flex; align-items: center; gap: 8px; color: var(--muted); font-size: 13px; margin: 4px 0 0; flex-wrap: wrap; }
  .spinner { width: 12px; height: 12px; border-radius: 50%; border: 2px solid var(--line); border-top-color: var(--text); animation: spin .8s linear infinite; }
  [data-style="brutal"] .device-code { border: var(--bw) dashed var(--brd); background: var(--todo); color: #000; }
  [data-style="brutal"] .device-code.ok { border-style: solid; background: var(--done); }
  /* toast */
  #toast { position: fixed; left: 50%; bottom: 28px; z-index: 30; transform: translate(-50%, 12px); opacity: 0; pointer-events: none;
    background: var(--text); color: var(--ink); font: 600 13.5px var(--body); padding: 10px 18px; border-radius: 999px;
    box-shadow: 0 10px 30px -8px rgba(0, 0, 0, .35); transition: opacity .18s ease-out, transform .18s ease-out; }
  #toast.on { opacity: 1; transform: translate(-50%, 0); }
  [data-style="brutal"] #toast { border: 3px solid var(--brd); box-shadow: 5px 5px 0 0 var(--brd); background: var(--todo); color: #000; font-family: var(--head); }
  [data-style="clay"] #toast { background: var(--surface); color: var(--text); box-shadow: var(--clay); font-family: var(--body); font-weight: 700; }

  /* look picker on the first screen: each tile is drawn in its own look, whatever look is active */
  .look-pick { margin-top: 20px; padding-top: 16px; border-top: 1px solid var(--line); }
  .look-pick .set-label span { opacity: .75; margin-left: 4px; }
  .look-tiles { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-top: 8px; }
  .look-tile { display: grid; gap: 8px; padding: 8px; background: none; border: 2px solid transparent; border-radius: 14px; cursor: pointer;
    color: var(--text); font: 600 13px var(--body); }
  .look-tile:hover { background: var(--raise); }
  .look-tile[aria-pressed="true"] { border-color: var(--focus); background: var(--raise); }
  .lp { display: grid; gap: 6px; align-content: center; height: 60px; padding: 10px; }
  .lp i { display: block; height: 7px; }
  .lp i:nth-child(1) { width: 60%; } .lp i:nth-child(2) { width: 85%; } .lp i:nth-child(3) { width: 45%; }
  .look-tile .lp-brutal { background: #fffdf5; border: 2.5px solid #000; box-shadow: 4px 4px 0 #000; border-radius: 0 !important; }
  .look-tile .lp-brutal i { background: #000; border-radius: 0 !important; } .look-tile .lp-brutal i:nth-child(1) { background: #ffd23f; border: 1.5px solid #000; height: 9px; }
  .look-tile .lp-clay { background: #eef1fb; border-radius: 16px !important; box-shadow: 5px 6px 12px rgba(98, 108, 170, .28), inset -3px -3px 6px rgba(98, 108, 170, .16), inset 3px 3px 6px #fff; }
  .look-tile .lp-clay i { background: #c9cfee; border-radius: 999px !important; } .look-tile .lp-clay i:nth-child(1) { background: #5f9dff; }
  .look-tile .lp-soft { background: #ffffff; border: 1px solid #dfe4ee; border-radius: 12px !important; box-shadow: 0 6px 16px -8px rgba(20, 20, 40, .25); }
  .look-tile .lp-soft i { background: #e6e9f2; border-radius: 4px !important; } .look-tile .lp-soft i:nth-child(1) { background: #2f6fed; }
  [data-style="brutal"] .look-tile { border-width: 3px; }
  .remember { display: flex; align-items: center; gap: 7px; font-size: 13px; margin: -2px 0 8px; color: var(--soft); cursor: pointer; }
  .remember span { color: var(--muted); }
  .acct-panel .remember input { accent-color: var(--text); margin: 0; width: auto; padding: 0; flex: none; box-shadow: none; }
  .remember span { font-size: 12px; }
  .signin-card .others { margin-top: 18px; border-top: 1px solid var(--line); padding-top: 14px; }
  /* avatar matches the 36px controls beside it: 32px image + 2px ring */
  .me { width: 32px; height: 32px; border-radius: 50%; background: var(--raise); object-fit: cover; display: block; }

  /* the status words */
  .statuses { position: relative; display: flex; gap: clamp(16px, 1.9vw, 30px); margin: 30px 0 22px; overflow-x: auto;
    scrollbar-width: none; padding-bottom: 14px; }
  .statuses::-webkit-scrollbar { display: none; }
  .st { background: none; border: 0; padding: 0; cursor: pointer; white-space: nowrap;
    font: 600 clamp(26px, 2.55vw, 40px)/1 var(--display); letter-spacing: -0.03em; color: var(--muted); opacity: .5;
    transition: opacity .15s, color .15s; display: flex; align-items: flex-start; gap: 6px; }
  .st:hover { opacity: .85; }
  .st[aria-selected="true"] { color: var(--text); opacity: 1; }
  .st sup { font: 500 14px var(--body); letter-spacing: 0; color: var(--c); margin-top: 2px; }
  .st.zero sup { color: var(--muted); }
  .bar { position: absolute; bottom: 0; height: 3px; border-radius: 2px; background: var(--c, var(--text));
    transition: left .28s cubic-bezier(.3,.7,.2,1), width .28s cubic-bezier(.3,.7,.2,1), background .28s; }

  /* project chips */
  .chips { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 28px; }
  .chip { background: none; border: 1px solid var(--line); color: var(--soft); border-radius: 999px;
    padding: 5px 13px; font: 500 13px var(--body); cursor: pointer; }

  @media (max-width: 760px) { .clocks { margin-left: 0; } }
  .pchip { display: inline-flex; align-items: center; gap: 8px; height: 32px; padding: 0 12px 0 6px; border-radius: 9px;
    color: var(--soft); background: none; border: 1px solid transparent; font: 500 13px var(--body); cursor: pointer; }
  .pchip:hover, .pchip[aria-expanded="true"] { background: var(--surface); border-color: var(--line); color: var(--text); }
  .pchip .ltr { width: 20px; height: 20px; border-radius: 6px; display: grid; place-items: center; flex: none;
    background: color-mix(in srgb, var(--h) 22%, transparent); color: var(--h); font: 700 11px var(--body); }
  .pchip .dots { display: flex; gap: 3px; }

  .pchip.pending { opacity: .55; }

  .pchip[aria-pressed="true"] { background: var(--text); border-color: var(--text); color: var(--ink); }
  .pchip[aria-pressed="true"] .cnt { color: var(--ink); opacity: .6; }
  .pchip.add { padding: 0 10px; color: var(--muted); border: 1px dashed var(--line); }
  #envpop { position: fixed; z-index: 12; width: 380px; max-width: calc(100vw - 24px); background: var(--pop);
    border: 1px solid var(--pop-line); border-radius: 14px; box-shadow: var(--shadow); padding: 12px;

    padding: 8px 6px 8px 10px; border-radius: 9px; color: var(--text); text-decoration: none; }

  /* waiting on you */

  /* standup */

    border: 1px solid var(--pop-line); border-radius: 14px; box-shadow: var(--shadow); padding: 14px 16px 16px;
    opacity: 0; visibility: hidden; transform: translateY(-4px); transition: opacity .14s ease-out, transform .14s ease-out; }

  .su-ranges { display: flex; flex-wrap: nowrap; gap: 6px; margin-bottom: 10px; overflow-x: auto; scrollbar-width: none; padding: 2px 6px 6px 2px; }

  /* standup preview */

    background: color-mix(in srgb, var(--c) 16%, var(--pop)); }
  .su-stats b { font: 700 15px var(--display); color: var(--text); }

  .su-doc ul { list-style: none; margin: 0; padding: 0 0 0 8px; }
  .su-doc li a { display: grid; grid-template-columns: 46px minmax(0, 1fr); align-items: start; gap: 6px; padding: 4px 7px; border-radius: 7px; color: var(--text);

  /* notes: personal to-dos, this browser only */

  /* work area: boards + notes sidebar */

  /* note row */
  .note { grid-template-columns: 16px minmax(0, 1fr) auto; gap: 10px; align-items: start; padding: 9px 10px; }

  /* hover card */

  /* Konami code: 60 seconds of green terminal */
  html.retro[data-style][data-mode] { --ink: #000; --surface: #010a02; --raise: #04200a; --line: #1f9e40; --pop: #010a02; --pop-raise: #04200a; --pop-line: #1f9e40; --brd: #39ff6a;

  /* ---------- neo-brutalism look (Settings → Look → Brutal), tokens from neubrutalism.com ---------- */
  :root[data-style="brutal"] {
    --brd: #000; --bw: 3px; --hard-sm: 3px 3px 0 0 var(--brd); --hard: 5px 5px 0 0 var(--brd); --shadow: 8px 8px 0 0 var(--brd);
    --ink: #fffdf5; --surface: #ffffff; --raise: #fff6d9; --line: #000; --pop: #ffffff; --pop-raise: #fffdf5; --pop-line: #000;
    --text: #000; --soft: #1f1f1f; --muted: #4a4a4a; --focus: #74b9ff;
    --todo: #ffd23f; --progress: #74b9ff; --review: #b8a9fa; --staging: #ffa552; --blocked: #ff6b6b; --backlog: #cfcfcf; --done: #88d498;
    --display: "Syne", "Space Grotesk", system-ui, sans-serif; --head: "Space Grotesk", system-ui, sans-serif;
    --body: "Inter", system-ui, sans-serif; --mono: "Space Mono", ui-monospace, monospace;
  }
  :root[data-style="brutal"][data-mode="dark"] {
    --brd: #fffdf5; --ink: #121212; --surface: #1c1c1c; --raise: #292929; --line: #fffdf5; --pop: #1c1c1c; --pop-raise: #292929; --pop-line: #fffdf5;
    --text: #fffdf5; --soft: #e8e5dc; --muted: #b5b2a9;
  }

  [data-style="brutal"] *, [data-style="brutal"] *::before, [data-style="brutal"] *::after { border-radius: 0 !important; }

  [data-style="brutal"] .note-add.mini { border: var(--bw) solid var(--brd); background: var(--surface); }
  [data-style="brutal"] .sk { background: var(--raise); border: 2px solid color-mix(in srgb, var(--brd) 15%, transparent); }
  [data-style="brutal"] .label i { box-shadow: 0 0 0 1.5px var(--brd); }

  /* ---------- claymorphism look (Settings → Look → Clay) ----------
     depth comes from light: an outer drop shadow plus a lighter inner top-left and a darker inner bottom-right;
     clay goes on containers and controls, list rows stay flat so text stays easy to read */
  :root[data-style="clay"] {
    --ink: #eef1fb; --surface: #f8f9ff; --raise: #e8ebfa; --line: rgba(98, 108, 170, .16); --pop: #f8f9ff; --pop-raise: #eceffc; --pop-line: rgba(98, 108, 170, .14);
    --text: #262840; --soft: #474b69; --muted: #767b9b; --focus: #7c6cf0;
    --todo: #ffbf47; --progress: #5f9dff; --review: #a585ff; --staging: #3fc9ba; --blocked: #ff6f84; --backlog: #a3a8c3; --done: #4ccd96;
    --tint: rgba(98, 108, 170, .2); --lit: rgba(255, 255, 255, .9);
    --clay: 12px 14px 28px var(--tint), inset -6px -7px 14px rgba(98, 108, 170, .13), inset 6px 6px 14px var(--lit);
    --clay-sm: 5px 6px 14px var(--tint), inset -3px -3px 7px rgba(98, 108, 170, .12), inset 3px 3px 7px var(--lit);
    --clay-in: inset 4px 5px 10px rgba(98, 108, 170, .22), inset -4px -4px 10px var(--lit);
    --shadow: 18px 22px 44px rgba(98, 108, 170, .28), inset -6px -7px 14px rgba(98, 108, 170, .12), inset 6px 6px 14px var(--lit);
    --display: "Fredoka", "Nunito", system-ui, sans-serif; --body: "Nunito", system-ui, sans-serif;
    --bounce: cubic-bezier(.34, 1.56, .64, 1);
  }
  :root[data-style="clay"][data-mode="dark"] {
    --ink: #22233a; --surface: #2d2f4d; --raise: #363959; --line: rgba(255, 255, 255, .07); --pop: #2f3151; --pop-raise: #383b5d; --pop-line: rgba(255, 255, 255, .06);
    --text: #f1f2ff; --soft: #cdd0ee; --muted: #9ea2c8; --focus: #a99dff;
    --tint: rgba(0, 0, 0, .38); --lit: rgba(255, 255, 255, .07);
    --clay: 12px 14px 28px var(--tint), inset -6px -7px 14px rgba(0, 0, 0, .28), inset 6px 6px 14px var(--lit);
    --clay-sm: 5px 6px 14px var(--tint), inset -3px -3px 7px rgba(0, 0, 0, .25), inset 3px 3px 7px var(--lit);
    --clay-in: inset 4px 5px 10px rgba(0, 0, 0, .35), inset -4px -4px 10px var(--lit);
    --shadow: 18px 22px 44px rgba(0, 0, 0, .45), inset -6px -7px 14px rgba(0, 0, 0, .25), inset 6px 6px 14px var(--lit);
  }
  [data-style="clay"] body { font-family: var(--body); }
  [data-style="clay"] :focus-visible { outline: 3px solid var(--focus); outline-offset: 3px; border-radius: 14px; }

  /* type: rounded display for headings, Nunito for everything else */
  [data-style="clay"] .st { font: 600 clamp(24px, 2.45vw, 40px)/1 var(--display); letter-spacing: -0.01em; }
  [data-style="clay"] #hello, [data-style="clay"] .project h2, [data-style="clay"] .rail-card h2, [data-style="clay"] .c-title, [data-style="clay"] .waiting h3, [data-style="clay"] .set-form header b, [data-style="clay"] #standup header b, [data-style="clay"] .signin-card h1,
  [data-style="clay"] .acct-me b, [data-style="clay"] #envpop header b, [data-style="clay"] .dt-num, [data-style="clay"] .clock .cl-t { font-family: var(--display); font-weight: 600; letter-spacing: 0; }
  [data-style="clay"] .chip, [data-style="clay"] .pchip, [data-style="clay"] .btn, [data-style="clay"] .icon-btn, [data-style="clay"] .scope button, [data-style="clay"] .more { font-family: var(--body); font-weight: 700; }

  /* containers: clay, no outlines */
  [data-style="clay"] .project, [data-style="clay"] .rail-card, [data-style="clay"] .waiting.busy, [data-style="clay"] .note-list:not(.flat), [data-style="clay"] .notes .note-add, [data-style="clay"] .signin-card {
    border: 0; border-radius: 28px; box-shadow: var(--clay); background: var(--surface); }
  [data-style="clay"] #card, [data-style="clay"] #envpop, [data-style="clay"] #standup, [data-style="clay"] #acct, [data-style="clay"] #settings { border: 0; border-radius: 26px; }
  [data-style="clay"] .project header, [data-style="clay"] .rail-card header { padding-top: 20px; }
  [data-style="clay"] .date-tile { border: 0; border-radius: 20px; box-shadow: var(--clay-sm); background: var(--todo); color: #3a2a00; width: 58px; }
  [data-style="clay"] .dt-day, [data-style="clay"] .dt-mon { color: #6b4e00; }
  [data-style="clay"] .dt-num { color: #3a2a00; }
  [data-style="clay"] .clock { border: 0; border-radius: 18px; box-shadow: var(--clay-sm); background: var(--surface); }
  [data-style="clay"] .clock.local { background: var(--progress); padding-left: 12px; }
  [data-style="clay"] .clock.local .cl-l, [data-style="clay"] .clock.local .cl-t, [data-style="clay"] .clock.local small { color: #fff; }

  /* status words: pastel pill counts, a soft pill underline */
  [data-style="clay"] .st:not([aria-selected="true"]) { opacity: .45; }
  [data-style="clay"] .st sup { background: color-mix(in srgb, var(--c) 30%, var(--surface)); color: var(--text); border-radius: 999px; padding: 2px 8px; font: 800 12px var(--body); box-shadow: var(--clay-sm); }
  [data-style="clay"] .st.zero sup { background: var(--raise); color: var(--muted); }
  [data-style="clay"] .bar { height: 8px; border-radius: 999px; box-shadow: var(--clay-sm); }

  /* controls: puffy, rise on hover, sink when pressed */
  [data-style="clay"] .chip, [data-style="clay"] .pchip, [data-style="clay"] .icon-btn, [data-style="clay"] .scope, [data-style="clay"] .search, [data-style="clay"] .btn, [data-style="clay"] .more, [data-style="clay"] .note-opts .add, [data-style="clay"] .note-add.mini {
    border: 0; box-shadow: var(--clay-sm); background: var(--surface); transition: transform .25s var(--bounce), box-shadow .2s; }
  [data-style="clay"] .chip, [data-style="clay"] .pchip, [data-style="clay"] .btn, [data-style="clay"] .icon-btn, [data-style="clay"] .scope, [data-style="clay"] .more { border-radius: 999px; }
  [data-style="clay"] .search, [data-style="clay"] .note-add.mini { border-radius: 18px; }
  [data-style="clay"] .chip:hover, [data-style="clay"] .pchip:hover, [data-style="clay"] .icon-btn:hover, [data-style="clay"] .btn:hover, [data-style="clay"] .more:hover { transform: translateY(-2px); box-shadow: var(--clay); }
  [data-style="clay"] .chip:active, [data-style="clay"] .pchip:active, [data-style="clay"] .icon-btn:active, [data-style="clay"] .btn:active, [data-style="clay"] .more:active { transform: translateY(1px) scale(.98); box-shadow: var(--clay-in); }
  [data-style="clay"] .chip[aria-pressed="true"], [data-style="clay"] .pchip[aria-pressed="true"] { background: var(--progress); color: #fff; box-shadow: var(--clay-in); }
  [data-style="clay"] .chip[aria-pressed="true"] span, [data-style="clay"] .pchip[aria-pressed="true"] .cnt { color: #fff; opacity: .8; }
  [data-style="clay"] .pchip.add { box-shadow: none; background: transparent; border: 2px dashed var(--line); }
  [data-style="clay"] .pchip .ltr { border-radius: 10px; }
  [data-style="clay"] .scope { padding: 4px; }
  [data-style="clay"] .scope button { border-radius: 999px; }
  [data-style="clay"] .scope button[aria-pressed="true"] { background: var(--progress); color: #fff; box-shadow: var(--clay-in); }
  [data-style="clay"] .search:focus-within, [data-style="clay"] .note-add.mini:focus-within { box-shadow: var(--clay-in); }
  [data-style="clay"] .btn.primary { background: var(--progress); color: #fff; }
  [data-style="clay"] .btn.red { background: var(--blocked); color: #fff; }
  [data-style="clay"] .more { width: calc(100% - 32px); margin: 4px 16px 16px; }
  [data-style="clay"] .c-icon { border-radius: 12px; }
  [data-style="clay"] .c-icon:hover { background: var(--raise); box-shadow: var(--clay-sm); border-color: transparent; }

  /* rows: flat and calm inside the clay */
  [data-style="clay"] li a, [data-style="clay"] .w-row, [data-style="clay"] .note, [data-style="clay"] .news-list li .news-item, [data-style="clay"] .zone-row { border-radius: 16px; }
  [data-style="clay"] li a:hover, [data-style="clay"] .w-row:hover, [data-style="clay"] .note:hover, [data-style="clay"] .news-item:hover { background: var(--raise); }
  [data-style="clay"] .due, [data-style="clay"] .raw, [data-style="clay"] .closed-tag, [data-style="clay"] .w-row .why b, [data-style="clay"] .c-head .pill, [data-style="clay"] .kind-tag, [data-style="clay"] .project header .owner {
    border: 0; border-radius: 999px; padding: 1px 9px; font-weight: 700; color: var(--text); background: color-mix(in srgb, var(--c, var(--backlog)) 26%, var(--surface)); }
  [data-style="clay"] .due { background: var(--raise); }
  [data-style="clay"] .due.soon { background: color-mix(in srgb, var(--todo) 40%, var(--surface)); }
  [data-style="clay"] .due.late { background: color-mix(in srgb, var(--blocked) 34%, var(--surface)); }
  [data-style="clay"] .closed-tag { --c: var(--done); }
  [data-style="clay"] .chk { border-radius: 7px; border-width: 2px; box-shadow: var(--clay-in); }
  [data-style="clay"] .note.done .chk { box-shadow: var(--clay-sm); }
  [data-style="clay"] kbd { border: 0 !important; border-radius: 8px !important; box-shadow: var(--clay-sm); background: var(--surface); }
  [data-style="clay"] .src { border-radius: 7px; }
  [data-style="clay"] img.src, [data-style="clay"] .people img, [data-style="clay"] .me { border-radius: 50%; }
  [data-style="clay"] .me-btn { border: 0; border-radius: 50%; box-shadow: var(--clay-sm); padding: 3px; background: var(--surface); transition: transform .25s var(--bounce), box-shadow .2s; }
  [data-style="clay"] .me-btn:hover { transform: translateY(-2px); box-shadow: var(--clay); }
  [data-style="clay"] .me { width: 30px; height: 30px; }
  [data-style="clay"] .sk { border-radius: 10px; }
  [data-style="clay"] .sk-card { box-shadow: var(--clay); }
  [data-style="clay"] .news-chips .chip { box-shadow: none; background: var(--raise); }
  [data-style="clay"] .news-chips .chip[aria-pressed="true"] { background: var(--progress); color: #fff; }
  [data-style="clay"] .device-code { border: 0; border-radius: 16px; box-shadow: var(--clay-in); background: var(--raise); }
  [data-style="clay"] .set-fields input, [data-style="clay"] .acct-panel input, [data-style="clay"] .p-add input, [data-style="clay"] .env-edit input, [data-style="clay"] .env-add input, [data-style="clay"] .su-custom input { border: 0; border-radius: 14px; box-shadow: var(--clay-in); background: var(--raise); }
  [data-style="clay"] .set-owner, [data-style="clay"] .acct-item { border-radius: 14px; }
  /* readable colored text: deepen the pastel toward the text color */
  [data-style="clay"] .ndue.soon { color: color-mix(in srgb, var(--todo) 45%, var(--text)); }
  [data-style="clay"] .ndue.late { color: color-mix(in srgb, var(--blocked) 60%, var(--text)); }
  [data-style="clay"] .closed-tag { color: color-mix(in srgb, var(--done) 35%, var(--text)); }
  /* clay shadows reach further than the others: give the scrolling sidebar room so they aren't clipped */
  [data-style="clay"] .rail { padding: 0 30px 40px 0; margin-right: -30px; }
  .look { width: max-content; margin-bottom: 4px; }
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div class="greet">
      <div class="date-tile" id="date-tile" aria-hidden="true"><span class="dt-day"></span><span class="dt-num"></span><span class="dt-mon"></span></div>
      <div class="greet-text"><b id="hello"></b><span class="greet-sub" id="greet-sub"></span><span class="sr-only" id="date"></span></div>
    </div>
    <span class="grow"></span>
    <label class="search"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="q" placeholder="Filter tasks" aria-label="Filter tasks"><kbd>/</kbd></label>
    <div class="scope" role="group" aria-label="Whose tasks">
      <button data-scope="mine">Mine</button><button data-scope="all">Everyone</button>
    </div>
    <div class="offline" id="offline" role="status" hidden title="No connection to GitHub. Tabboard refreshes by itself when you're back online."><i></i><b>Offline</b><span></span></div>
    <button class="icon-btn" id="refresh" title="Refresh"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M20 11a8 8 0 1 0-2.3 5.7M20 4v7h-7"/></svg><span id="ago"></span></button>
    <button class="icon-btn standup-btn" id="standup-btn" aria-expanded="false" title="Standup (S)">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M8 4h8M9 2h6v4H9zM6 4H5a1 1 0 0 0-1 1v15a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1V5a1 1 0 0 0-1-1h-1M8 11h8M8 15h5"/></svg>Standup</button>
    <button class="icon-btn" id="settings-btn" title="Settings" aria-label="Settings" aria-haspopup="dialog" aria-expanded="false">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg></button>
    <button class="icon-btn" id="mode" title="Switch light / dark" aria-label="Switch light / dark">
      <svg class="moon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"/></svg>
      <svg class="sun" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
    </button>
    <button type="button" class="me-btn" id="me-btn" aria-haspopup="menu" aria-expanded="false" title="Account"><img class="me" id="me" alt=""></button>
  </div>

  <div class="subrow"><nav class="links" id="links" aria-label="Projects"></nav><div class="clocks" id="clocks" aria-label="World clocks"></div></div>
  <section id="waiting" aria-live="polite"></section>

  <nav class="statuses" id="statuses" role="tablist" aria-label="Status"></nav>
  <div class="chips" id="chips" role="group" aria-label="Project"></div>
  <div class="work" id="work"><main id="list"></main><aside class="rail" id="rail" aria-label="Notes"></aside></div>
  <div id="card" role="tooltip"></div>
  <div id="standup" role="dialog" aria-label="Standup"></div>
  <div id="envpop" role="dialog" aria-label="Environments"></div>
  <div id="acct" role="menu" aria-label="Account"></div>
  <div id="settings" role="dialog" aria-label="Settings"></div>
  <div id="signin" hidden></div>
  <div id="toast" role="status" aria-live="polite"></div>
  <div id="fun-pop" role="dialog" aria-label="Fun"></div>

  <footer>
    <span><kbd>/</kbd>filter</span><span><kbd>1</kbd>–<kbd>7</kbd>switch tab</span><span><kbd>M</kbd>mine / everyone</span><span><kbd>N</kbd>new note</span><span><kbd>S</kbd>standup</span><span><kbd>C</kbd>copy hovered task</span><span><kbd>O</kbd>open it in a new tab</span>
    <span class="quip" id="quip"></span><button type="button" class="duck" id="duck" title="Rubber duck. Explain your bug to it." aria-label="Rubber duck">🦆</button>
  </footer>
</div>

<script src="app.js"></script>
</body>
</html>
